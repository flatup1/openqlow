server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 1m;

    # アプリ本体まで通して答えさせる。
    # 以前は nginx が固定文字列を返していたため、Node が死んでいても 200 が返り、
    # URL監視が「元気です」と嘘をついていた（SYSTEM_BLUEPRINT §12 C-7）。
    # nginx だけが生きている状態と区別するため、必ずアプリへ転送する。
    location = /openqlow/health {
        proxy_pass http://127.0.0.1:8787/openqlow/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # アプリが落ちていれば 502 が返る。それが正しい姿。
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # nginx 自身が生きているかだけを見たいとき用（アプリの生死は見ていない）。
    location = /openqlow/nginx-alive {
        default_type text/plain;
        return 200 "nginx ok\n";
    }

    location = /openqlow/webhook {
        proxy_pass http://127.0.0.1:8787/openqlow/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Line-Signature $http_x_line_signature;
    }

    location / {
        default_type text/plain;
        return 200 "OPENQLOW dedicated VPS\n";
    }
}
