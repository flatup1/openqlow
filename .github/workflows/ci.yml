name: CI

# main への PR と push で、テストと AI OS 検証を自動実行する。
# 目的: 正本（src/shared/canon.ts）と同期ビューのズレ、Skills の破損、
# 秘密情報の混入を、人が目視する前に機械が止める。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 同じブランチで新しい push があれば、古い実行は打ち切る（無駄なジョブを残さない）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # テストは担当領域ごとに並列で走らせる。
  # どの領域が壊れたかが GitHub の画面で一目で分かり、他の領域は最後まで走る。
  test:
    name: test (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # 1グループ落ちても残りは打ち切らない。壊れた範囲を1回で把握するため。
      fail-fast: false
      matrix:
        group: [core, aika, line, crm, publish, ops]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # 依存はロックファイルどおりに入れる（本番と同じ組み合わせを保証）。
      - name: Install dependencies
        run: npm ci

      # グループ単位のテスト。typecheck は下の validate ジョブが1回だけ実行する。
      - name: Run tests
        run: npm run test:group:${{ matrix.group }}

  # animation-studio は独立した npm プロジェクト（React + Express）で、
  # ルートの依存ゼロ方針とは別世界。ルートの test を重くしないよう別ジョブにする。
  # ここに入れる前は 1,700行超が誰にも検証されていなかった（SYSTEM_BLUEPRINT §12 C-3）。
  animation-studio:
    name: test (animation-studio)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: animation-studio/package-lock.json

      - name: Install dependencies
        working-directory: animation-studio
        run: npm ci

      # APIキー無しのデモモードで走る。外部へ課金・送信しない。
      - name: Run tests
        working-directory: animation-studio
        run: npm test

      - name: Typecheck
        working-directory: animation-studio
        run: npm run typecheck

  validate:
    name: typecheck and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # AI OS の検証。Codex CLI はこの環境に無いため、該当検査は SKIP 扱いになる。
      - name: Validate AI OS
        run: |
          bash scripts/validate-ai-os.sh
          bash scripts/validate-ai-os.test.sh

      # Skills の正本と配布（.claude / .agents）が一致しているか。
      - name: Check skill sync
        run: bash scripts/sync-agent-skills.sh --check
