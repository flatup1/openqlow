# UIZIN 大会用プロファイル（ひな形）
#
# 使い方:
#   1. このファイルを uizin.yml にコピーする
#   2. `calibrate` を実行すると roi / source_size / template_size / templates が自動で埋まる
#   3. 検出がずれたら segment: のしきい値だけを触る（コードは触らない）
#
# ★テロップのデザインが変わったら、calibrate をやり直すだけで対応できる。

name: uizin

# 「試合中か」を判定する矩形: [x, y, 幅, 高さ]
# ★スコアボードの中でも「ずっと変わらない部分」（外枠・ロゴ・区切り線）だけを囲む。
#   選手名やタイマーを含めると、名前が変わっただけで一致度が落ちる（実測 0.945→0.856）。
#   枠とロゴだけなら 0.994→0.993 でほぼ落ちない。
roi: [0, 0, 0, 0]

# 上の roi を測ったときの動画解像度。実際の動画が別解像度でも自動換算される。
source_size: [1920, 1080]

# 照合用に縮小するサイズ。小さいほど速く、ノイズに強い。
template_size: [160, 40]

# 基準画像（このファイルからの相対パス）。複数指定すると一致度は最大値を採用する。
# 例: 赤コーナー表示と青コーナー表示でデザインが違う場合は2枚登録する。
templates: []

# 「同じ試合か」を判定する矩形（任意）: [x, y, 幅, 高さ]
# ★選手名テロップだけを囲む。タイマーを含めてはいけない。
#   タイマーを含めると同じ試合のラウンド間でも一致度が 0.781 まで落ち、試合が割れる。
#   名前だけなら 同じ試合=1.000 / 別の試合=0.770 ではっきり分かれる。
# 未設定なら max_gap_sec だけで判断する（従来動作）。
same_match_roi: null

# この一致度以上なら「同じ試合のラウンド間」とみなして繋ぐ
same_match_threshold: 0.85

# 解析のサンプリング間隔。1.0 = 1秒に1回。0.5 にすると2秒に1回で倍速だが粗くなる。
fps: 1.0

# 出力フォルダ名のひな形（現状は --event 指定を優先）
event_name_format: "第{n}回大会"

segment:
  # 一致度がこの値以上で「試合中」に入る
  enter_threshold: 0.62
  # この値未満で「試合外」に戻る。入口より低くしてチラつきを防ぐ（ヒステリシス）
  exit_threshold: 0.45
  # これより短い区間は捨てる（リプレイ・一瞬の再表示を除去）
  min_duration_sec: 45
  # この秒数以下の途切れは同じ試合として繋ぐ（引きの画・観客カット）
  max_gap_sec: 20
  # 検出開始より前に足す秒数（入場の余韻）
  pre_roll_sec: 6
  # 検出終了より後ろに足す秒数（勝ち名乗り）
  post_roll_sec: 8
  # これを超える区間は too_long フラグを立てて人間に確認してもらう
  long_segment_sec: 1200
  # ラウンド間としてありえる最大の途切れ。
  # same_match_roi で「同じ試合」と確認できた場合だけ、ここまでの途切れを繋ぐ。
  round_gap_sec: 180
